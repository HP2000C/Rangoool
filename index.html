<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>رنگول | Rangoool</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      margin: 0;
      padding: 20px;
      direction: rtl;
      position: relative;
    }
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }
    .game-wrapper {
      width: 100%;
      max-width: 500px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .main-title {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #1976D2, #4CAF50, #F44336, #FF9800, #9C27B0, #E91E63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.2;
      letter-spacing: 2px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }
    .time-bar-container {
      width: 100%;
      height: 14px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .time-bar-fill {
      height: 100%;
      width: 100%;
      background-color: #4CAF50;
      border-radius: 20px;
      transition: width 0.1s linear, background-color 0.1s linear;
    }
    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 30px 25px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      border: 2px solid transparent;
      background-image: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), linear-gradient(135deg, #1976D2, #4CAF50, #F44336, #FF9800, #9C27B0, #E91E63);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 25px;
      font-weight: 500;
      color: #334155;
      font-size: 1.1rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 8px 18px;
      border-radius: 50px;
    }
    .word-display {
      font-size: 4.5rem;
      font-weight: 900;
      margin: 20px 0 30px;
      transition: 0.15s;
      text-shadow: 2px 4px 12px rgba(0,0,0,0.1);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0 10px;
      margin-top: 5px;
      gap: 10px;
    }
    .hint-divider {
      width: 2px;
      height: 20px;
      background: linear-gradient(180deg, #1976D2, #4CAF50, #F44336, #FF9800, #9C27B0, #E91E63);
      border-radius: 2px;
    }
    .menu-btn {
      position: fixed;
      top: 25px;
      right: 25px;
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      z-index: 1050;
    }
    .menu-btn span {
      display: block;
      width: 22px;
      height: 3px;
      background: #1e293b;
      border-radius: 10px;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.03);
      z-index: 1100;
      padding: 30px 25px;
      transition: right 0.4s;
      display: flex;
      flex-direction: column;
      gap: 25px;
      overflow-y: auto;
    }
    .sidebar.open { right: 0; }
    .sidebar h3 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
      margin-right: 20px;
      text-align: right;
    }
    .sidebar label { font-weight: 600; color: #334155; margin-bottom: 8px; display: block; }
    .home-btn, .record-box, .help-btn {
      background: #f1f5f9;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-weight: 600;
      color: #1e293b;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      text-decoration: none;
      cursor: pointer;
    }
    .record-box {
      background: #fef9c3;
      justify-content: center;
      font-weight: 700;
      color: #854d0e;
    }
    .help-btn {
      background: #e0f2fe;
      color: #0369a1;
      justify-content: center;
    }
    .custom-select {
      position: relative;
      width: 100%;
    }
    .select-button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      text-align: right;
      color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .select-arrow {
      transition: transform 0.3s ease;
      font-size: 0.8rem;
    }
    .select-arrow.open { transform: rotate(180deg); }
    .select-options {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      list-style: none;
      padding: 0;
      margin: 5px 0 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      z-index: 10;
    }
    .select-options.open { max-height: 200px; }
    .select-options li {
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid #e2e8f0;
    }
    .select-options li:last-child { border-bottom: none; }
    .select-options li:hover { background: #f1f5f9; }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      transition: opacity 0.3s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-content {
      background: white;
      padding: 35px 30px;
      border-radius: 50px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
      max-width: 320px;
      width: 100%;
    }
    .game-title {
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #1976D2, #4CAF50, #F44336, #FF9800, #9C27B0, #E91E63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .sub-message { font-size: 1.1rem; font-weight: 500; color: #475569; margin-bottom: 15px; }
    .score-big { font-size: 5.5rem; font-weight: 900; color: #0f172a; margin-top: 10px; }
    #newRecordBadge {
      display: none;
      margin-top: 20px;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(45deg, #FFD700, #FFA500, #FF6347, #FF1493, #8A2BE2, #00CED1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .cooldown-timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }
    .cooldown-circle {
      position: relative;
      width: 60px;
      height: 60px;
    }
    .cooldown-circle svg { transform: rotate(-90deg); }
    .cooldown-circle .bg {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 6;
    }
    .cooldown-circle .progress {
      fill: none;
      stroke: #4CAF50;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 150.8;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.1s linear;
    }
    .cooldown-number {
      display: flex;
      align-items: baseline;
      gap: 0;
      font-weight: 900;
      color: #0f172a;
      direction: ltr; /* عدد صحیح سمت چپ، اعشار سمت راست */
    }
    .cooldown-int { font-size: 1.5rem; }
    .cooldown-decimal {
      font-size: 0.9rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .cooldown-message {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 3px;
    }
    /* Help Overlay */
    .help-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .help-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .help-modal {
      background: white;
      border-radius: 30px;
      max-width: 400px;
      width: 90%;
      max-height: 80vh;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      text-align: right;
    }
    .help-header {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 15px 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .help-close-btn {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }
    .help-title {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #1976D2, #4CAF50, #F44336, #FF9800, #9C27B0, #E91E63);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .help-body {
      font-size: 1rem;
      line-height: 1.8;
      color: #1e293b;
      white-space: pre-line;
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      /* نوار اسکرول سفارشی */
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #f1f5f9;
    }
    .help-body::-webkit-scrollbar {
      width: 6px;
    }
    .help-body::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .help-body::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 10px;
    }
    .help-body::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .help-body .example {
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 15px;
      margin: 10px 0;
    }
    #confetti-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 950;
    }
  </style>
</head>
<body>
  <canvas id="stars-canvas"></canvas>
  <div class="game-wrapper">
    <h1 class="main-title">رنگول | Rangoool</h1>
    <div class="time-bar-container">
      <div class="time-bar-fill" id="timeBarFill"></div>
    </div>
    <div class="card">
      <div class="stats-bar">
        <div class="stat-item"><span>✅</span> <span id="scoreDisplay">0</span></div>
        <div class="stat-item"><span>⏳</span> <span id="timerDisplay">10.00</span>s</div>
      </div>
      <div class="word-display" id="wordDisplay"></div>
      <div class="hint">
        <span>👉 راست: هماهنگ</span>
        <div class="hint-divider"></div>
        <span>👈 چپ: ناهماهنگ</span>
      </div>
    </div>
    <div class="menu-btn" id="menuToggle"><span></span><span></span><span></span></div>
    <div class="sidebar" id="sidebar">
      <h3>منو</h3>
      <button class="home-btn" id="homeBtn">🏠 صفحه اصلی</button>
      <button class="help-btn" id="helpBtn">❓ راهنما</button>
      <div>
        <label>🎮 سطح</label>
        <div class="custom-select" id="difficultySelectWrapper">
          <button class="select-button" id="difficultyButton">
            <span>آسان</span>
            <span class="select-arrow">▼</span>
          </button>
          <ul class="select-options" id="difficultyOptions">
            <li data-value="easy">آسان</li>
            <li data-value="medium">متوسط</li>
            <li data-value="hard">سخت</li>
          </ul>
        </div>
      </div>
      <div class="record-box" id="recordEasy">🏆 رکورد آسان: 0</div>
      <div class="record-box" id="recordMedium">🏆 رکورد متوسط: 0</div>
      <div class="record-box" id="recordHard">🏆 رکورد سخت: 0</div>
      <div>
        <label>🌐 زبان</label>
        <div class="custom-select" id="langSelectWrapper">
          <button class="select-button" id="langButton">
            <span>فارسی</span>
            <span class="select-arrow">▼</span>
          </button>
          <ul class="select-options" id="langOptions">
            <li data-value="fa">فارسی</li>
            <li data-value="en">English</li>
            <li data-value="ar">العربية</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="overlay-content">
        <div class="game-title" id="overlayGameTitle">رنگول | Rangoool</div>
        <div class="sub-message" id="overlayMessage">برای شروع کلیک کن</div>
        <div class="score-big" id="overlayScore" style="display:none;">0</div>
        <div id="newRecordBadge">رکورد جدید | NEW</div>
        <div id="cooldownTimerContainer" style="display:none;">
          <div class="cooldown-timer-container">
            <div class="cooldown-circle">
              <svg width="60" height="60">
                <circle class="bg" cx="30" cy="30" r="24"></circle>
                <circle class="progress" id="cooldownProgress" cx="30" cy="30" r="24"></circle>
              </svg>
            </div>
            <div class="cooldown-number">
              <span class="cooldown-int" id="cooldownInt">2</span>
              <span class="cooldown-decimal" id="cooldownDecimal">.00</span>
            </div>
            <div class="cooldown-message" id="cooldownMessage">باید ۲ ثانیه صبر کنی</div>
          </div>
        </div>
      </div>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <!-- Help Overlay -->
  <div class="help-overlay" id="helpOverlay">
    <div class="help-modal">
      <div class="help-header">
        <div class="help-title" id="helpTitle">🎮 راهنما</div>
        <button class="help-close-btn" id="helpCloseBtn">✕</button>
      </div>
      <div class="help-body" id="helpBody"></div>
    </div>
  </div>

  <script>
    (() => {
      // DOM elements
      const wordDisplay = document.getElementById('wordDisplay');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const timerDisplay = document.getElementById('timerDisplay');
      const timeBarFill = document.getElementById('timeBarFill');
      const overlay = document.getElementById('overlay');
      const overlayGameTitle = document.getElementById('overlayGameTitle');

      const newRecordBadge = document.getElementById('newRecordBadge');
      const cooldownTimerContainer = document.getElementById('cooldownTimerContainer');
      const cooldownProgress = document.getElementById('cooldownProgress');
      const cooldownInt = document.getElementById('cooldownInt');
      const cooldownDecimal = document.getElementById('cooldownDecimal');
      const cooldownMessage = document.getElementById('cooldownMessage');
      const menuToggle = document.getElementById('menuToggle');
      const sidebar = document.getElementById('sidebar');
      const homeBtn = document.getElementById('homeBtn');
      const helpBtn = document.getElementById('helpBtn');

      const ctx = confettiCanvas.getContext('2d');

      // Difficulty settings
      const DIFFICULTIES = {

      };
      let currentDifficulty = 'medium';
      let currentBonus = DIFFICULTIES[currentDifficulty].initialBonus;

        hard: parseInt(localStorage.getItem('rangoool_record_hard')) || 0
      };

      // Translations

          hintLeft: 'چپ: ناهماهنگ', hintRight: 'راست: هماهنگ',
          newRecord: 'رکورد جدید | NEW',
          helpTitle: '🎮 راهنما',
          helpBody: `👀 روی صفحه یک کلمه می‌بینی که با یک رنگ نوشته شده...

        },
        en: {
          title: 'Rangoool | Rangoool', startMsg: 'Tap to start',
          gameOverTitle: 'Rangoool | Rangoool', gameOverSub: 'Unfortunately you lost...!',
          cooldownMsg: 'Wait 2 seconds', cooldownMsgNewRecord: 'Wait 4 seconds',
          colors: ['Blue','Green','Red','Black','Purple','Yellow','Orange','Brown','Pink'],
          menuTitle: 'Menu', home: 'Home', language: 'Language', help: 'Help',
          recordEasy: 'Easy Record', recordMedium: 'Medium Record', recordHard: 'Hard Record',
          difficultyLabel: 'Difficulty', difficultyEasy: 'Easy', difficultyMedium: 'Medium', difficultyHard: 'Hard',
          hintLeft: 'Left: Mismatch', hintRight: 'Right: Match',
          newRecord: 'New Record | NEW',
          helpTitle: '🎮 Help',
          helpBody: `👀 You see a word on the screen written in a color...

🤔 You need to decide: does the color match the word's meaning?

        gamepadConnected = true;
        initAudio();
        requestAnimationFrame(handleGamepadInput);
      });
      window.addEventListener("gamepaddisconnected", () => {
        gamepadConnected = false;
      });

      updateUI();
      resetToIdle();
      document.body.addEventListener('touchstart', initAudio, { once: true });
    })();
  </script>
</body>
        </html>
